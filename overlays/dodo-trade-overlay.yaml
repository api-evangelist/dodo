overlay: 1.0.0
info:
  title: API Evangelist enhancements for DODO Trade / Route API
  version: 1.0.0
extends: openapi/dodo-trade-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: true
      x-apievangelist-provider: dodo
      x-apievangelist-category: crypto-defi-dex
