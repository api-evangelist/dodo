aid: dodo
name: DODO
description: >-
  DODO is a decentralized exchange (DEX) and on-chain liquidity provider built on the
  Proactive Market Maker (PMM) algorithm, engineered for capital-efficient liquidity and
  low slippage across many EVM blockchains. Its Trade / Route API aggregates prices across
  DODO v1/v2, 1inch, 0x, ParaSwap, professional market makers, and DODO's own aggregation
  algorithm, returning real-time swap quotes plus executable ABI calldata that developers
  send directly to the DODORouteProxy / DODOV2Proxy contracts. DODO is backed by Pantera
  Capital and ships open-source smart contracts, JavaScript/TypeScript SDKs, a contract
  request library, and embeddable swap widgets.
